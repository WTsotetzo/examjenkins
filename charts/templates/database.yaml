{{- range $name, $database := .Values.databases }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-db
  labels:
    app.kubernetes.io/name: {{ $name }}-db
    app.kubernetes.io/part-of: fastapiapp
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: {{ $name }}-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-db
  labels:
    app.kubernetes.io/name: {{ $name }}-db
    app.kubernetes.io/part-of: fastapiapp
spec:
  serviceName: {{ $name }}-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}-db
        app.kubernetes.io/part-of: fastapiapp
    spec:
      containers:
        - name: postgres
          image: "{{ $database.image }}"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $database.name | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-db-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $database.storage }}
---
{{- end }}
