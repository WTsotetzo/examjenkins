{{- $root := . }}
{{- range $name, $service := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  labels:
    app.kubernetes.io/name: {{ $name }}-service
    app.kubernetes.io/part-of: fastapiapp
spec:
  replicas: {{ $service.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}-service
        app.kubernetes.io/part-of: fastapiapp
    spec:
      serviceAccountName: {{ include "fastapiapp.serviceAccountName" $root }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}-service
          image: "{{ $service.image.repository }}:{{ $service.image.tag }}"
          imagePullPolicy: {{ $service.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: app-db-credentials
                  key: {{ $name | upper }}_DATABASE_URI
            {{- if eq $name "movie" }}
            - name: CAST_SERVICE_HOST_URL
              value: "http://cast-service:8000/api/v1/casts/"
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/{{ $name }}s/docs
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/{{ $name }}s/docs
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $service.resources | nindent 12 }}
---
{{- end }}
