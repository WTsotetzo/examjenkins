imagePullSecrets: []

services:
  cast:
    replicaCount: 1
    image:
      repository: docker.io/replace-me/cast-service
      tag: latest
      pullPolicy: IfNotPresent
    resources: {}
  movie:
    replicaCount: 1
    image:
      repository: docker.io/replace-me/movie-service
      tag: latest
      pullPolicy: IfNotPresent
    resources: {}

databases:
  cast:
    image: postgres:12.1-alpine
    name: cast_db
    storage: 1Gi
  movie:
    image: postgres:12.1-alpine
    name: movie_db
    storage: 1Gi

nginx:
  image:
    repository: nginx
    tag: 1.27-alpine
  replicaCount: 1

service:
  type: ClusterIP
  port: 8080
  nodePort: null

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
